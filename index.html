<script>

/* ویڈیوز ایڈمن پینل سے خود بخود آتی ہیں */
const API_BASE = "https://drive-video-nook.lovable.app";
let videos = [];

function driveStream(id){
    return API_BASE + "/api/public/stream/" + encodeURIComponent(id);
}

const vid     = document.getElementById('vid');
const seek    = document.getElementById('seek');
const playBtn = document.getElementById('playBtn');
const timeEl  = document.getElementById('time');
const speedEl = document.getElementById('speed');
const titleEl = document.getElementById('active-title');
const dlLink  = document.getElementById('download-link');
const listEl  = document.getElementById('video-list');

function fmt(t){
    if(!isFinite(t)) t = 0;
    const m = Math.floor(t/60);
    const s = Math.floor(t%60);
    return m + ":" + (s<10 ? "0" : "") + s;
}

const ctrl = document.querySelector('.ctrl');

function playVideo(index){
    const v = videos[index];
    titleEl.innerText = v.title;
    vid.dataset.try = "0";
    vid.dataset.id = v.id;
    if(typeof clearFrame === "function"){ clearFrame(); }
    vid.style.display = "block"; ctrl.classList.add("hide");
    vid.src = driveStream(v.id);
    dlLink.href = API_BASE + "/api/public/download/" + encodeURIComponent(v.id);
    vid.load();
    vid.playbackRate = Number(speedEl.value);
    vid.play().catch(function(){});
    document.querySelectorAll('.video-list button').forEach(function(b, i){
        b.classList.toggle('active', i === index);
    });
    vid.dataset.id = v.id;
}

/* اگر ویڈیو نہ چلے تو پہلے سیدھا ڈرائیو سے، پھر ڈرائیو کا اپنا پلیئر خود کھل جائے */
const boxEl = document.querySelector('.video-box');
function clearFrame(){
    const f = boxEl.querySelector('iframe');
    if(f){ f.remove(); }
}
vid.addEventListener('error', function(){
    if(!vid.getAttribute('src')) return;
    if(vid.dataset.try === "0"){
        vid.dataset.try = "1";
        vid.src = "https://drive.usercontent.google.com/download?id=" + vid.dataset.id + "&export=download&confirm=t";
        vid.load();
        vid.play().catch(function(){});
        return;
    }
    vid.pause();
    vid.removeAttribute('src');
    vid.style.display = "none";
    ctrl.classList.add('hide');
    clearFrame();
    const f = document.createElement('iframe');
    f.src = "https://drive.google.com/file/d/" + vid.dataset.id + "/preview";
    f.allow = "autoplay; fullscreen";
    f.setAttribute('allowfullscreen', '');
    f.style.cssText = "width:100%;height:100%;border:0;display:block;";
    boxEl.appendChild(f);
});

function togglePlay(){
    if(vid.paused){ vid.play().catch(function(){}); } else { vid.pause(); }
}

playBtn.onclick = togglePlay;
let hideTimer;
function showCtrl(){
    ctrl.classList.remove('hide');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
        if(!vid.paused){ ctrl.classList.add('hide'); }
    }, 3500);
}
function hideCtrl(){
    clearTimeout(hideTimer);
    ctrl.classList.add('hide');
}
vid.onclick = function(){
    if(ctrl.classList.contains('hide')){ showCtrl(); } else { hideCtrl(); }
};
ctrl.addEventListener('click', showCtrl);
ctrl.addEventListener('input', showCtrl);
vid.addEventListener('pause', function(){ clearTimeout(hideTimer); ctrl.classList.remove('hide'); });
vid.addEventListener('play', showCtrl);
document.getElementById('backBtn').onclick = function(){ vid.currentTime = Math.max(0, vid.currentTime - 10); };
document.getElementById('fwdBtn').onclick  = function(){ vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10); };
speedEl.onchange = function(){ vid.playbackRate = Number(speedEl.value); };

vid.addEventListener('play',  function(){ playBtn.textContent = "❚❚"; });
vid.addEventListener('pause', function(){ playBtn.textContent = "▶"; });
vid.addEventListener('timeupdate', function(){
    if(vid.duration){ seek.value = (vid.currentTime / vid.duration) * 100; }
    timeEl.textContent = fmt(vid.currentTime) + " / " + fmt(vid.duration);
});
vid.addEventListener('loadedmetadata', function(){
    timeEl.textContent = fmt(vid.currentTime) + " / " + fmt(vid.duration);
});
seek.addEventListener('input', function(){
    if(vid.duration){ vid.currentTime = (seek.value / 100) * vid.duration; }
});

fetch(API_BASE + "/api/public/videos")
    .then(function(r){ return r.json(); })
    .then(function(list){
        videos = list;
        listEl.innerHTML = "";
        videos.forEach(function(v, i){
            const btn = document.createElement('button');
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = v.title;
            const pl = document.createElement('span');
            pl.textContent = '▶ PLAY';
            btn.appendChild(tag); btn.appendChild(pl);
            btn.onclick = function(){ playVideo(i); };
            listEl.appendChild(btn);
        });
        if(videos.length){ playVideo(0); }
    })
    .catch(function(){ titleEl.innerText = "Videos load nahi huin"; });

<script>
	(() => {
		if (window.self !== window.top || navigator.userAgent.includes('puppeteer')) {
			const badge = document.querySelector('#lovable-badge');
			if (badge) {
				badge.style.display = 'none';
			}
			return;
		}

		const closeButton = document.querySelector('#lovable-badge-close');
		if (closeButton) {
			closeButton.addEventListener('click', function(event) {
				event.preventDefault();
				event.stopPropagation();
				const badge = document.querySelector('#lovable-badge');
				if (badge) {
					badge.classList.add('closing');
					setTimeout(function() {
						if (badge) {
							badge.style.display = 'none';
						}
					}, 240);
				}
			});
		}
	})();
</script>
